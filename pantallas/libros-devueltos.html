<html lang="es-CO"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Libros devueltos · Mi librería</title><link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/components.css"><script src="../js/data.js" defer></script><script src="../js/app.js" defer></script><script src="../js/fase3-datos.js" defer></script><script src="../js/fase3.js" defer></script><script src="../js/listas-filtrables.js" defer></script><script src="../js/tablas-paginadas.js" defer></script></head>
<body class="phase3" data-page="libros-devueltos" data-group="libros-devueltos" data-back="inicio.html"><div data-shell></div><noscript>Active JavaScript para usar los formularios y guardar los datos registrados. <a href="inicio.html">Ir a Inicio</a>.</noscript><div class="layout"><aside data-menu></aside><main id="contenido" tabindex="-1" aria-labelledby="titulo-pagina"><header class="page-header"><p class="eyebrow">Mi librería · Libros devueltos</p><h1 id="titulo-pagina">Libros devueltos</h1><p>Registre los libros que regresa un cliente o que entrega a un proveedor.</p></header><p class="alert warning" id="persistencia"></p><p id="estado" role="status" tabindex="-1" hidden></p><section class="panel form-panel" aria-labelledby="datos-devuelto"><h2 id="datos-devuelto">Datos de los libros devueltos</h2><form id="devuelto-form" novalidate><div class="field"><label for="origen">¿De dónde viene el registro?</label><select id="origen" name="origen"><option value="ventas">De una venta: regresa del cliente</option><option value="compras">De una compra: se entrega al proveedor</option></select></div><p id="efecto" class="hint"></p><div class="field"><label for="documento">Compra o venta original</label><select id="documento" name="documento"><option value="">Elija el registro original</option></select></div><div class="field"><label for="libro-devuelto">Libro del registro original</label><select id="libro-devuelto" name="libro-devuelto"><option value="">Elija un libro</option></select></div><p id="disponible" class="hint"></p><div class="field"><label for="cantidad-devuelta">Cantidad de ejemplares devueltos</label><input id="cantidad-devuelta" name="cantidad-devuelta" type="number" inputmode="numeric" min="1" step="1" value="1" required></div><div class="field"><label for="motivo">Motivo</label><textarea id="motivo" name="motivo" required maxlength="500" data-hint="motivo-ayuda" aria-describedby="motivo-ayuda"></textarea><span class="hint" id="motivo-ayuda">Por ejemplo: lle
